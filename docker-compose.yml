services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
      POSTGRES_DB: ${POSTGRES_DB:-demo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/seed_sql:/seed
      - ./data/ingest_samples:/ingest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demo} -d ${POSTGRES_DB:-demo} -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 30

  db_init:
    image: postgres:15
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
      POSTGRES_DB: ${POSTGRES_DB:-demo}
    volumes:
      - ./data/seed_sql:/seed
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      "
       psql -v ON_ERROR_STOP=1 postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB -f /seed/00_schema.sql &&
       psql -v ON_ERROR_STOP=1 postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB -f /seed/01_seed_demo.sql &&
       psql -v ON_ERROR_STOP=1 postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@db:5432/$POSTGRES_DB -f /seed/02_views.sql"

  agent:
    profiles: ["agent"]
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      AGENT_DB_URL: ${AGENT_DB_URL:-postgresql+psycopg2://demo:demo@db:5432/demo}
      POLL_SECONDS: ${POLL_SECONDS:-60}
      RISK_CREATE_THRESHOLD: ${RISK_CREATE_THRESHOLD:-70}
      ALERT_THRESHOLD: ${ALERT_THRESHOLD:-85}
      INGEST_DIR: /ingest
      GOV_POLICY_PATH: /governance/policy.yaml
      DEMO_EXPERIENCE_PACK_PATH: /contracts/demo_experience_pack.yaml
      DEMO_STORY_PACK_PATH: /contracts/demo_story_pack.yaml
      LIFECYCLE_MODEL_PATH: /contracts/lifecycle_model.yaml
      ONTOLOGY_PATH: /contracts/supply_chain_ontology.yaml
    volumes:
      - ./data/ingest_samples:/ingest
      - ./contracts:/contracts:ro
      - ./operations/governance:/governance
    depends_on:
      db:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully

  api:
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      AGENT_DB_URL: ${AGENT_DB_URL:-postgresql+psycopg2://demo:demo@db:5432/demo}
      ERP_CONNECTOR: mock
      API_PORT: "8000"
      GOV_POLICY_PATH: /governance/policy.yaml
      DEMO_EXPERIENCE_PACK_PATH: /contracts/demo_experience_pack.yaml
      DEMO_STORY_PACK_PATH: /contracts/demo_story_pack.yaml
      LIFECYCLE_MODEL_PATH: /contracts/lifecycle_model.yaml
      ONTOLOGY_PATH: /contracts/supply_chain_ontology.yaml
    ports:
      - "8000:8000"
    volumes:
      - ./contracts:/contracts:ro
      - ./operations/governance:/governance
      - ./data/seed_sql:/seed:ro
    depends_on:
      db:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    command: ["bash", "-lc", "uvicorn app.api_main:app --host 0.0.0.0 --port 8000"]

  cleanup:
    profiles: ["agent"]
    build:
      context: ./apps/api
    env_file:
      - .env
    environment:
      AGENT_DB_URL: ${AGENT_DB_URL:-postgresql+psycopg2://demo:demo@db:5432/demo}
      APP_ENV: ${APP_ENV:-dev}
      GOV_POLICY_PATH: /governance/policy.yaml
    volumes:
      - ./operations/governance:/governance
    depends_on:
      db:
        condition: service_healthy
      db_init:
        condition: service_completed_successfully
    command: ["bash", "-lc", "python -m app.jobs.cleanup_loop"]

  web:
    profiles: ["web"]
    build:
      context: ./apps/web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_started

  news_monitor:
    profiles: ["signals"]
    build:
      context: ./apps/news_monitor
    environment:
      API_BASE: http://api:8000
      NEWS_TOPIC: commodities
      NEWS_MODE: ${NEWS_MODE:-deterministic}
      POLL_SECONDS: ${NEWS_POLL_SECONDS:-30}
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
