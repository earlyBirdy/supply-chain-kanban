version: '1.0'
name: SupplyChainOntology
description: Canonical ontology contract for the Supply Chain AI Agent enterprise
  demo. It defines business objects, source-system mappings, AI-agent decision packets,
  blockchain-ready evidence datasets, and simple UI views shared by human operators
  and governed automation.
contract:
  canonical: true
  revision: continuous-improvement
  source_of_truth: contracts/supply_chain_ontology.yaml
  companion_contracts:
    action_catalog: contracts/action_catalog.yaml
    lifecycle_model: contracts/lifecycle_model.yaml
    governance_policy: governance/policy.yaml
    control_plane_manifest: contracts/control_plane_manifest.yaml
  runtime:
    ontology_loader: apps/api/app/ontology_store.py
    policy_loader: apps/api/app/policy_store.py
    lifecycle_loader: apps/api/app/lifecycle_store.py
  prediction_packet_schema: commodity_prediction_packet.v1
object_types:
  Resource:
    description: A constrained resource/material (e.g., memory, freight lane, resin).
    key: resource_id
    properties:
      resource_id:
        type: string
      display_name:
        type: string
        optional: true
      category:
        type: string
        optional: true
      criticality:
        type: string
        optional: true
        enum:
        - low
        - medium
        - high
  SKU:
    description: Sellable/plan-able item identifier.
    key: sku
    properties:
      sku:
        type: string
      family:
        type: string
        optional: true
      description:
        type: string
        optional: true
  Supplier:
    description: Supplier or upstream partner.
    key: supplier_id
    properties:
      supplier_id:
        type: string
      name:
        type: string
        optional: true
      country:
        type: string
        optional: true
      risk_tier:
        type: string
        optional: true
        enum:
        - tier1
        - tier2
        - tier3
  Plant:
    description: Manufacturing site.
    key: plant_id
    properties:
      plant_id:
        type: string
      name:
        type: string
        optional: true
      location:
        type: string
        optional: true
  Location:
    description: Demand / fulfillment location.
    key: location
    properties:
      location:
        type: string
      region:
        type: string
        optional: true
  Order:
    description: ERP demand/commit order.
    key: order_id
    canonical_table: erp_orders
    properties:
      order_id:
        type: string
      sku:
        type: string
      location:
        type: string
      qty:
        type: number
      need_date:
        type: date
        optional: true
      net_price:
        type: number
        optional: true
      ts:
        type: datetime
        optional: true
  Shipment:
    description: WMS shipment record.
    key: shipment_id
    canonical_table: wms_shipments
    properties:
      shipment_id:
        type: string
      order_id:
        type: string
        optional: true
      supplier_id:
        type: string
        optional: true
      delivered_qty:
        type: number
      ordered_qty:
        type: number
      delivered_on_time:
        type: boolean
      lead_time_days:
        type: number
        optional: true
      period:
        type: string
        optional: true
      ts:
        type: datetime
        optional: true
  ProductionRecord:
    description: MES production output record.
    key: record_id
    canonical_table: mes_production
    properties:
      record_id:
        type: string
      plant_id:
        type: string
      sku:
        type: string
      input_qty:
        type: number
      good_qty:
        type: number
      scrap_qty:
        type: number
      period:
        type: string
        optional: true
      ts:
        type: datetime
        optional: true
  MarketSignal:
    description: Exogenous market signal (price, index, lead-time index).
    key: (resource_id, ts, signal_type)
    canonical_table: market_signals
    properties:
      ts:
        type: datetime
      resource_id:
        type: string
      signal_type:
        type: string
      value:
        type: number
      period:
        type: string
        optional: true
  OpsSignal:
    description: Operational signal (OTIF, backlog, utilization, yield).
    key: (scope_type, scope_id, ts, metric)
    canonical_table: ops_signals
    properties:
      ts:
        type: datetime
      scope_type:
        type: string
      scope_id:
        type: string
      metric:
        type: string
      value:
        type: number
      period:
        type: string
        optional: true
  ForecastPlan:
    description: Demand-planning object that links customer forecast, ERP demand,
      constrained supply, and finance exposure.
    key: forecast_id
    properties:
      forecast_id:
        type: string
      sku:
        type: string
      customer_commitment_id:
        type: string
        optional: true
      period:
        type: string
      forecast_qty:
        type: number
      confidence_score:
        type: number
        optional: true
      revenue_exposure:
        type: number
        optional: true
      source_system:
        type: string
        optional: true
        enum:
        - ERP
        - CRM
        - CSV
        - planner_override
  InventoryPosition:
    description: Current and projected inventory view across ERP/WMS/MES for shortage,
      excess, and allocation reasoning.
    key: inventory_position_id
    properties:
      inventory_position_id:
        type: string
      sku:
        type: string
      location:
        type: string
      on_hand_qty:
        type: number
      allocated_qty:
        type: number
        optional: true
      projected_shortage_qty:
        type: number
        optional: true
      projected_excess_qty:
        type: number
        optional: true
      source_system:
        type: string
        optional: true
        enum:
        - ERP
        - WMS
        - MES
        - CSV
  PartnerPerformanceMetric:
    description: Supplier, carrier, or factory performance KPI used by the AI agent
      to rank risk and recovery actions.
    key: metric_id
    properties:
      metric_id:
        type: string
      partner_id:
        type: string
      partner_type:
        type: string
        enum:
        - supplier
        - carrier
        - factory
        - customer
      metric:
        type: string
        enum:
        - OTIF
        - yield
        - scrap
        - efficiency
        - response_aging
        - ppm
      value:
        type: number
      period:
        type: string
      source_system:
        type: string
        optional: true
  NewsRiskSignal:
    description: News-derived commodity, logistics, supplier, or geopolitical risk
      signal before the risk appears inside ERP/MES.
    key: news_signal_id
    properties:
      news_signal_id:
        type: string
      topic:
        type: string
      title:
        type: string
      source:
        type: string
      severity:
        type: number
      impacted_resource_id:
        type: string
        optional: true
      impacted_supplier_id:
        type: string
        optional: true
      recommended_arrangement:
        type: string
        optional: true
      observed_at:
        type: datetime
  AgentDecision:
    description: Human-readable AI decision packet connecting evidence, recommendation,
      approval, and writeback.
    key: decision_id
    properties:
      decision_id:
        type: string
      case_id:
        type: string
      recommendation_id:
        type: string
        optional: true
      approval_state:
        type: string
        enum:
        - draft
        - needs_approval
        - approved
        - rejected
        - executed
      business_impact:
        type: object
      evidence_refs:
        type: array
        items:
          type: string
      created_at:
        type: datetime
  Case:
    description: AI agent case representing an emerging constraint.
    key: case_id
    canonical_table: agent_cases
    state_field: status
    lifecycle_ref: contracts/lifecycle_model.yaml#objects.case
    properties:
      case_id:
        type: uuid
      status:
        type: string
        enum:
        - AT_RISK
        - MITIGATION
        - RESOLVED
        - PAUSED
      owner:
        type: string
        optional: true
      resource_id:
        type: string
      scope:
        type: object
        optional: true
      risk_score:
        type: integer
      confidence:
        type: number
      lead_time_to_failure_days:
        type: integer
        optional: true
      root_signals:
        type: object
        optional: true
      last_observed_period:
        type: string
        optional: true
      created_at:
        type: datetime
      updated_at:
        type: datetime
  KanbanCard:
    description: Operational kanban card as a first-class object (Kinetic surface).
    key: card_id
    canonical_table: kanban_cards
    state_field: status
    lifecycle_ref: contracts/lifecycle_model.yaml#objects.kanban_card
    properties:
      card_id:
        type: uuid
      case_id:
        type: uuid
        optional: true
      resource_id:
        type: string
      scope:
        type: object
      title:
        type: string
      description:
        type: string
        optional: true
      status:
        type: string
        enum:
        - todo
        - in_progress
        - blocked
        - resolved
      priority:
        type: integer
        optional: true
      assignee:
        type: string
        optional: true
      tags:
        type: array
        items:
          type: string
        optional: true
      sla_hours:
        type: integer
        optional: true
      sla_due_at:
        type: datetime
        optional: true
      breached:
        type: boolean
        optional: true
      blocked_reason:
        type: string
        optional: true
      last_activity_at:
        type: datetime
        optional: true
      resolved_at:
        type: datetime
        optional: true
      created_at:
        type: datetime
      updated_at:
        type: datetime
  Recommendation:
    description: Ranked recommendation for a case.
    key: rec_id
    canonical_table: agent_recommendations
    properties:
      rec_id:
        type: uuid
      case_id:
        type: uuid
      rank:
        type: integer
      action_type:
        type: string
      action_payload:
        type: object
      service_score:
        type: integer
      cost_score:
        type: integer
      risk_score:
        type: integer
      decision_score:
        type: integer
      created_at:
        type: datetime
  PendingAction:
    description: Materialized action proposal awaiting approval or execution.
    key: pending_id
    canonical_table: pending_actions
    state_field: status
    lifecycle_ref: contracts/lifecycle_model.yaml#objects.pending_action
    properties:
      pending_id:
        type: uuid
      case_id:
        type: uuid
      card_id:
        type: uuid
        optional: true
      materialization_id:
        type: uuid
        optional: true
      status:
        type: string
        enum:
        - pending
        - approved
        - rejected
        - executed
        - blocked
        - canceled
      approval_required:
        type: boolean
      action_type:
        type: string
      action_payload:
        type: object
      rationale:
        type: string
        optional: true
      rank:
        type: integer
        optional: true
      approved_by:
        type: string
        optional: true
      approved_at:
        type: datetime
        optional: true
      executed_action_id:
        type: uuid
        optional: true
      execution_result:
        type: string
        optional: true
      superseded_by:
        type: uuid
        optional: true
      superseded_at:
        type: datetime
        optional: true
      canceled_at:
        type: datetime
        optional: true
      canceled_reason:
        type: string
        optional: true
      created_at:
        type: datetime
      updated_at:
        type: datetime
  Action:
    description: Executed (or attempted) action triggered by a human/agent.
    key: action_id
    canonical_table: agent_actions
    properties:
      action_id:
        type: uuid
      case_id:
        type: uuid
      channel:
        type: string
        enum:
        - ui
        - api
        - slack
        - agent
        - supervisor
        - system
      action_type:
        type: string
      payload:
        type: object
      result:
        type: string
        optional: true
      created_at:
        type: datetime
  AuditEvent:
    description: Immutable audit event for actions, violations, and policy decisions.
    key: id
    canonical_table: audit_log
    properties:
      id:
        type: uuid
      ts:
        type: datetime
      actor:
        type: string
        optional: true
      action:
        type: string
      entity_type:
        type: string
        optional: true
      entity_id:
        type: string
        optional: true
      payload:
        type: object
  ExternalDataSource:
    description: Named external source that feeds traceability evidence, such as ERP,
      WMS, IoT, supplier portal, news, or audit data.
    key: source_id
    properties:
      source_id:
        type: string
      label:
        type: string
      source_type:
        type: string
      trust_tier:
        type: string
        enum:
        - high
        - standard
        - low
      validation_method:
        type: string
      owner:
        type: string
        optional: true
  TraceabilityEvent:
    description: Case-linked physical or operating event observed from an external
      data source and validated before buyer-facing use.
    key: event_id
    properties:
      event_id:
        type: string
      case_id:
        type: string
      source_id:
        type: string
      event_type:
        type: string
      object_ref:
        type: string
      observed_at:
        type: datetime
      validation_status:
        type: string
        enum:
        - verified
        - cross_checked
        - pending
        - rejected
      evidence_confidence:
        type: number
      payload:
        type: object
        optional: true
  EvidenceReceipt:
    description: Buyer-facing proof summary derived from traceability events with
      validation status and evidence confidence.
    key: receipt_id
    properties:
      receipt_id:
        type: string
      case_id:
        type: string
      trace_event_id:
        type: string
        optional: true
      evidence_type:
        type: string
      validation_status:
        type: string
      confidence_score:
        type: number
      summary:
        type: string
      receipt_payload:
        type: object
        optional: true
  BlockchainAnchor:
    description: Ledger proof stub for anchoring an EvidenceReceipt hash. It proves
      anchoring intent, not raw-world truth.
    key: anchor_id
    properties:
      anchor_id:
        type: string
      receipt_id:
        type: string
      ledger_name:
        type: string
      anchor_status:
        type: string
        enum:
        - stubbed
        - queued
        - anchored
        - failed
      tx_ref:
        type: string
      content_hash:
        type: string
      proof_payload:
        type: object
        optional: true
  CommodityRiskSignal:
    description: Ontology-linked commodity risk signal created from news, market,
      supplier, price, policy, and BOM evidence; not a headline-only feed.
    key: commodity_risk_id
    properties:
      commodity_risk_id:
        type: string
      commodity_family:
        type: string
        description: 'Examples: memory, advanced_packaging, critical_minerals, rare_earth_magnets,
          defense_metals, high_reliability_passives.'
      materials:
        type: array
        items:
          type: string
        description: Affected materials such as HBM, DDR5, DRAM, NAND, SSD, ABF substrate,
          gallium, germanium, tungsten, antimony.
      risk_stage:
        type: string
        enum:
        - normal
        - weak_signal
        - trend_formation
        - shortage_warning
        - allocation_crisis
      early_warning_score:
        type: number
      prediction_window:
        type: string
        description: 'Typical window: 6-12 months.'
      source_signal_ids:
        type: array
        items:
          type: string
        optional: true
      affected_industries:
        type: array
        items:
          type: string
        optional: true
      affected_suppliers:
        type: array
        items:
          type: string
        optional: true
      affected_logistics_lanes:
        type: array
        items:
          type: string
        optional: true
      financial_exposure:
        type: object
        optional: true
      recommended_approval_gated_actions:
        type: array
        items:
          type: string
        optional: true
      created_at:
        type: datetime
  EvidenceSource:
    description: Source record used by a prediction packet with source confidence,
      extraction confidence, publish date, and evidence-quality score.
    key: source_id
    properties:
      source_id:
        type: string
      source_type:
        type: string
        enum:
        - news
        - market_report
        - supplier_quote
        - erp
        - mes
        - wms
        - tms
        - bom_plm
        - stock_etf
        - policy_export_control
        - analyst_report
        - manual_upload
      source_name:
        type: string
      publish_date:
        type: date
        optional: true
      time_period:
        type: string
        optional: true
      url_or_reference:
        type: string
        optional: true
      signal:
        type: string
      source_confidence:
        type: number
      extraction_confidence:
        type: number
      evidence_quality_score:
        type: number
      evidence_hash:
        type: string
        optional: true
  PriceRangeSignal:
    description: Price range / market movement signal for contract price, spot price,
      supplier quote, stock/ETF confirmation, or FX exposure.
    key: price_signal_id
    properties:
      price_signal_id:
        type: string
      commodity_family:
        type: string
      indicator:
        type: string
      period:
        type: string
      min_change_pct:
        type: number
      max_change_pct:
        type: number
      currency:
        type: string
        optional: true
      valid_from:
        type: date
        optional: true
      valid_to:
        type: date
        optional: true
      quote_valid_until:
        type: date
        optional: true
      source_confidence:
        type: number
  ErpMesWmsTmsMetadataMap:
    description: ERP/MES/WMS/TMS-compatible metadata block that preserves interconnection
      keys for writeback and audit.
    key: metadata_map_id
    properties:
      metadata_map_id:
        type: string
      erp_company_code:
        type: string
        optional: true
      erp_plant:
        type: string
        optional: true
      erp_purchasing_org:
        type: string
        optional: true
      erp_material_ids:
        type: array
        items:
          type: string
        optional: true
      erp_vendor_ids:
        type: array
        items:
          type: string
        optional: true
      purchase_orders:
        type: array
        items:
          type: string
        optional: true
      mes_factory:
        type: string
        optional: true
      mes_line:
        type: string
        optional: true
      work_orders:
        type: array
        items:
          type: string
        optional: true
      wms_warehouse:
        type: string
        optional: true
      wms_bin:
        type: string
        optional: true
      inventory_days:
        type: number
        optional: true
      safety_stock_days:
        type: number
        optional: true
      tms_lane_id:
        type: string
        optional: true
      tms_origin:
        type: string
        optional: true
      tms_destination:
        type: string
        optional: true
      tms_carrier:
        type: string
        optional: true
  HumanContext5W:
    description: 人事時地物 explanation context for planner-facing and audit-facing shortage
      predictions.
    key: human_context_id
    properties:
      human_context_id:
        type: string
      who_people_orgs:
        type: object
        description: '人: suppliers, vendor IDs, affected customers, industries, approval
          owner.'
      what_changed:
        type: object
        description: '事: demand acceleration, supplier capacity shift, price movement,
          lead-time risk, quote-validity change.'
      when_timeline:
        type: object
        description: '時: lookback period, weak-signal date, trend-formation date,
          headline-confirmation date, prediction window.'
      where_locations:
        type: object
        description: '地: supplier regions, plants, warehouses, logistics lanes, customer
          markets.'
      which_objects:
        type: object
        description: '物: materials, ERP material IDs, BOM IDs, SKUs, POs, WOs, lots/batches.'
  SupplyChainRiskReview:
    description: Primary planner-facing Supply Chain Risk Review / S&OP Exception
      Report view for a shortage prediction.
    key: risk_review_id
    properties:
      risk_review_id:
        type: string
      signal:
        type: string
      risk:
        type: string
      exposure:
        type: array
        items:
          type: string
      business_impact:
        type: string
      scenario_planning:
        type: object
        description: base_case, risk_case, worst_case.
      options:
        type: array
        items:
          type: string
      recommendation:
        type: string
      owner_approval:
        type: object
      evidence_confidence:
        type: object
      follow_up_triggers:
        type: array
        items:
          type: string
  RcaAppendix5Why8DLite:
    description: Supporting RCA/corrective-action appendix. 5 Why and 8D-lite help
      explain root cause but are not the primary supply-chain view.
    key: rca_appendix_id
    properties:
      rca_appendix_id:
        type: string
      five_why:
        type: array
        items:
          type: object
      eight_d_lite:
        type: object
        description: D1 owner/team, D2 problem, D3 containment, D4 root cause, D5
          action, D6 validation, D7 recurrence prevention, D8 evidence closure.
  CommodityPredictionPacket:
    description: Machine-readable shortage prediction packet linking planner summary,
      Supply Chain Risk Review, 人事時地物, ERP/MES/WMS/TMS keys, sources, price ranges,
      AI prediction, and evidence hashes.
    key: prediction_id
    properties:
      prediction_id:
        type: string
      schema_version:
        type: string
        description: commodity_prediction_packet.v1
      commodity_family:
        type: string
      materials:
        type: array
        items:
          type: string
      lookback_period:
        type: object
        description: start, end, trend_observed_for.
      prediction_window:
        type: string
      planner_summary:
        type: string
        description: For the last 6 months, memory showed rising AI demand, supplier
          capacity shift, price momentum, stock/ETF confirmation, and BOM exposure.
          The news headline confirms a trend already detected earlier.
      risk_review_ref:
        type: string
        optional: true
      rca_appendix_ref:
        type: string
        optional: true
      human_context_ref:
        type: string
        optional: true
      metadata_map_ref:
        type: string
        optional: true
      price_range_refs:
        type: array
        items:
          type: string
        optional: true
      source_refs:
        type: array
        items:
          type: string
        optional: true
      early_warning_score:
        type: number
      risk_stage:
        type: string
      source_confidence:
        type: number
      extraction_confidence:
        type: number
      model_confidence:
        type: number
      combined_confidence:
        type: number
      recommended_actions:
        type: array
        items:
          type: string
      requires_human_approval:
        type: boolean
      approval_owner:
        type: string
      writeback_targets:
        type: array
        items:
          type: string
      evidence_hash:
        type: string
      decision_hash:
        type: string
      action_receipt_id:
        type: string
  SourceSystemConnector:
    description: ERP/MES/WMS/TMS/supplier/news/blockchain connector profile used to
      control read-only sync, approval-gated writeback, trust tier, and field mapping.
    key: connector_id
    canonical_table: source_system_connectors
    properties:
      connector_id:
        type: string
      system_type:
        type: string
        enum:
        - ERP
        - MES
        - WMS
        - TMS
        - SupplierPortal
        - NewsMonitor
        - MarketData
        - BlockchainEvidence
        - CSV
      display_name:
        type: string
      mode:
        type: string
        enum:
        - read_only
        - approval_gated_writeback
        - proof_anchor_only
      trust_tier:
        type: string
        enum:
        - high
        - standard
        - low
      owner:
        type: string
        optional: true
      sync_cadence:
        type: string
        optional: true
      last_sync_at:
        type: datetime
        optional: true
      field_map_ref:
        type: string
        optional: true
  SourceRecordReference:
    description: Stable pointer back to the original ERP/MES/WMS/TMS/news/blockchain
      source row so every ontology object remains auditable and writeback-safe.
    key: source_ref_id
    canonical_table: source_record_references
    properties:
      source_ref_id:
        type: string
      connector_id:
        type: string
      source_system:
        type: string
      source_table:
        type: string
        optional: true
      source_record_id:
        type: string
