governance:
  guardrails:
  - name: RequireHumanApprovalAboveThreshold
    description: For risk_score >= 85, require explicit human approval before executing
      typed actions.
  - name: TypedActionsOnly
    description: Agents and humans must mutate operating state only through the action
      catalog; raw table writes are out of contract.
integration_model:
  strategy: read_only_first_then_approval_gated_writeback
  system_roles:
    ERP: Purchase orders, sales orders, inventory balance, supplier/material master,
      and financial exposure.
    MES: Production orders, yield, scrap, downtime, IQC/OQC quality holds, and line
      capacity.
    WMS: Inbound/outbound stock movement, pick-pack status, and warehouse exceptions.
    TMS: Shipment ETA, carrier delay, route risk, and premium freight cost.
    SupplierPortal: Confirmations, ASN, capacity promises, OTIF exceptions, and escalation
      tickets.
    NewsMonitor: Commodity, logistics, supplier, and geopolitical signals converted
      into NewsRiskSignal objects.
    BlockchainEvidence: Tamper-evident anchors for EvidenceReceipt hashes after approval/writeback,
      not the operational database.
  ai_agent_loop:
  - Sense ERP/MES/WMS/TMS/supplier/news signals.
  - Map facts into ontology objects and relationships.
  - Predict risk, cost, service, and inventory impact.
  - Recommend recovery action with business explanation.
  - Require human approval for external-system changes.
  - Execute governed writeback and attach receipt/audit/blockchain-ready proof.
  ui_principles:
  - Show top major issues first, not raw tables.
  - Keep forecast, inventory, partner KPI, and IOP action cards on one page.
  - Explain each decision in CFO language: cost, risk, service, approval, proof.
  - Keep blockchain evidence visible but outside the default operational path.
  metadata_rule: Every news, market, supplier, price, BOM, and AI prediction signal
    must preserve ERP/MES/WMS/TMS-compatible keys for interconnection, approval-gated
    writeback, and audit.
  planner_facing_layers:
    primary_view: Supply Chain Risk Review / S&OP Exception Report
    supporting_rca: 5 Why + 8D-lite appendix
    machine_readable_packet: commodity_prediction_packet.v1
  prediction_packet_required_context:
  - 人/who
  - 事/what_changed
  - 時/when
  - 地/where
  - 物/which_objects
  - sources_with_confidence
  - time_period
  - price_ranges
  - ERP/MES/WMS/TMS keys
  - approval_owner
  - writeback_target
  - evidence_hash
  - decision_hash
  - action_receipt_id
  layers:
  - layer: 1. Source system connector
    purpose: Read ERP/MES/WMS/TMS/supplier/news data without disrupting the system
      of record.
    ontology_objects:
    - SourceSystemConnector
    - SourceRecordReference
  - layer: 2. Canonical business ontology
    purpose: Normalize rows into orders, inventory, production, BOM exposure, partner
      KPIs, capacity constraints, and risk cases.
    ontology_objects:
    - Order
    - InventoryPosition
    - ProductionRecord
    - BillOfMaterialsExposure
    - CapacityConstraint
    - PartnerPerformanceMetric
    - Case
  - layer: 3. AI-agent automation
    purpose: Sense, map, detect, predict, recommend, request approval, and produce
      a receipt.
    ontology_objects:
    - AgentRun
    - NewsRiskSignal
    - CommodityPredictionPacket
    - AgentDecision
    - PendingAction
  - layer: 4. Governed writeback
    purpose: Allow only approved changes to touch ERP/MES/WMS/TMS/supplier portals.
    ontology_objects:
    - WritebackReceipt
    - EvidenceReceipt
    - AuditEvent
  - layer: 5. Evidence + blockchain dataset
    purpose: Keep operational data in the database while anchoring hashes/receipts
      for tamper-evident proof.
    ontology_objects:
    - TraceabilityEvent
    - EvidenceReceipt
    - BlockchainAnchor
  - layer: 6. Simple user experience
    purpose: Show top issues, next decision, affected object, action, approval owner,
      target system, and proof; hide raw tables by default.
    ontology_objects:
    - SimpleUIView
    - SAndOPException
    - SupplyChainRiskReview
  source_to_ontology_mapping:
    ERP:
      read:
      - PO
      - SO
      - MRP
      - inventory
      - supplier/material master
      - cost exposure
      objects:
      - Order
      - InventoryPosition
      - ForecastPlan
      - BillOfMaterialsExposure
      writeback_after_approval:
      - purchase_request
      - PO_note
      - allocation_note
    MES:
      read:
      - work order
      - yield
      - scrap
      - downtime
      - IQC/OQC hold
      - line capacity
      objects:
      - ProductionRecord
      - CapacityConstraint
      - PartnerPerformanceMetric
      writeback_after_approval:
      - quality_disposition_request
      - build_priority_note
    WMS:
      read:
      - on hand
      - allocated
      - inbound
      - outbound
      - pick/pack exception
      objects:
      - InventoryPosition
      - Shipment
      writeback_after_approval:
      - allocation_move
      - expedite_pick_pack_task
    TMS:
      read:
      - ETA
      - carrier delay
      - route risk
      - freight cost
      objects:
      - Shipment
      - PartnerPerformanceMetric
      writeback_after_approval:
      - expedite_request
      - reroute_request
    SupplierPortal:
      read:
      - confirmation
      - ASN
      - capacity promise
      - OTIF exception
      objects:
      - Supplier
      - PartnerPerformanceMetric
      - TraceabilityEvent
      writeback_after_approval:
      - supplier_escalation_ticket
    NewsMonitor:
      read:
      - commodity
      - supplier
      - logistics
      - geopolitical
      - export-control signal
      objects:
      - NewsRiskSignal
      - CommodityRiskSignal
      - CommodityPredictionPacket
      writeback_after_approval: []
    BlockchainEvidence:
      read:
      - anchor status
      - receipt hash
      - commitment proof
      objects:
      - EvidenceReceipt
      - BlockchainAnchor
      writeback_after_approval:
      - anchor_receipt_hash_only
    CSV:
      read:
      - legacy reports and fast onboarding extracts
      objects:
      - SourceRecordReference
      - Order
      - Shipment
      - ProductionRecord
      - InventoryPosition
      writeback_after_approval: []
  ai_agent_automation_contract:
    allowed_without_human_approval:
    - read source data
    - map fields
    - score risk
    - draft recommendation
    - simulate scenarios
    - prepare writeback payload
    - create evidence packet
    requires_human_approval:
    - ERP/MES/WMS/TMS/supplier portal writeback
    - purchase commitment
    - customer allocation change
    - supplier escalation sent externally
    - blockchain anchor submission if it represents legal/commercial commitment
    blocked:
    - silent source-system changes
    - unexplained model-only decisions
    - writeback without receipt
    - evidence without source reference
  news_prediction_model:
    purpose: Convert headlines and market feeds into ontology-linked risk signals
      instead of a news-only feed.
    minimum_packet_fields:
    - human_context
    - source_confidence
    - extraction_confidence
    - model_confidence
    - time_period
    - price_ranges
    - erp_mes_wms_tms_mapping
    - bom_exposure
    - recommended_actions
    - follow_up_triggers
    memory_window: 6-12 month weak-signal window before mainstream shortage headlines
      when data is available.
  blockchain_dataset_model:
    operational_truth: Postgres/API tables remain the operational source of truth
      for the dashboard and approvals.
    anchored_dataset:
    - EvidenceReceipt
    - WritebackReceipt
    - AgentDecision
    - TraceabilityEvent
    anchor_payload:
    - receipt_hash
    - decision_hash
    - source_record_hashes
    - action_receipt_id
    - timestamp
    - validation_status
    rule: Anchor hashes/proofs only; do not make blockchain the default operational
      database.
  simple_ui_experience:
    home_question: What are the top major issues, what action is recommended, who
      must approve, which system changes, and what proof is kept?
    default_cards:
    - Major issues
    - AI Leader Dashboard
    - Project E2E Flow
    - Next Decision
    - AI Agent Workbench
    - Decide
    - Simulate + Execute
    - Prove
    - Audit Timeline
    progressive_disclosure:
    - start with top issues
    - open one case
    - show affected order/BOM/supplier/plant
    - simulate options
    - approve or reject
    - execute governed writeback
    - show evidence receipt
    personas:
      planner: risk, supply/demand gap, next action
      cfo: revenue/cost exposure, approval policy, proof
      plant_manager: capacity, yield, quality hold, OQC release
      supplier_manager: OTIF, ASN, confirmation, escalation
dashboard_enhancement_blueprint:
  goal: Improve the supply-chain dashboard with ERP/MES integration, AI agent skills,
    blockchain-ready proof, commodity/news radar, and simple UX/UI.
  simple_ui_question: What is the top issue, what object is affected, what action
    is recommended, who approves it, where will it write back, and what proof exists?
  layers:
  - ERP/MES/WMS/TMS/supplier/news source records
  - canonical ontology and source references
  - AI agent skills and bounded autoresearch extension
  - Commodity Trend Radar and live news risk conversion
  - human approval gate and governed writeback
  - EvidenceReceipt, WritebackReceipt, BlockchainAnchor proof
  new_runtime_endpoints:
  - /agent_skills/
  - /commodity_trends/
  - /news/items
  - /news/check-now
  ux_default: Major issues first; drill down to source records only when the operator
    asks for evidence or writeback details.
