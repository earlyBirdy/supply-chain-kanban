demo_scripts:
  guided_buyer_walkthrough:
    label: Guided buyer walkthrough
    steps:
      - id: executive
        title: Open Executive Mode
        ui_action: executive_on
        narration: Start with the executive story so the buyer sees business impact before system detail.
      - id: board
        title: Open the Risk Board
        ui_action: executive_off
        narration: Move into the board to show governed work in flight and which lane is under pressure.
      - id: focus_case
        title: Focus the Lead Case
        ui_action: select_focus_case
        narration: Open the seeded flagship case for this vertical pack and explain why it matters now.
      - id: pending
        title: Open Pending Approval
        ui_action: focus_pending
        narration: Show that AI does not write directly into systems; it proposes a typed action that still needs approval.
      - id: simulate
        title: Run Simulation
        ui_action: simulate_first_pending
        narration: Run the preview so the buyer can see downstream impact before writeback.
      - id: receipt
        title: Show Receipt and Proof
        ui_action: focus_receipt
        narration: End on the governed receipt, connector family, and audit trail to reinforce enterprise trust.
